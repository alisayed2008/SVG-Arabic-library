           C900 220 820 280 780 340
           C740 400 700 520 640 560
           C580 600 500 610 460 590
           C420 570 360 490 300 460
           C220 420 380 160 200 220
           L120 300
           V1140
           H60
           Z"
        fill="#c91010" filter="url(#soft)"/>

  <!-- الشريط الأبيض (الخط المنحني) -->
  <path d="M90 760
           C220 620 300 420 420 320
           C520 240 650 260 720 340
           C780 410 820 560 840 660
           C860 770 820 840 740 860
           C680 875 600 820 540 780
           C480 740 420 700 360 700
           C300 700 360 720 420 760
           C480 800 560 860 680 860
           C820 860 900 780 980 700
           L980 640
           C900 720 820 780 740 780
           C640 780 620 720 560 660
           C520 620 480 580 420 560
           C360 540 240 620 160 760
           Z"
        fill="#ffffff"/>

  <!-- تفريغ داخلي في الشريط الأبيض لإظهار حواف بيضاء أكثر دقة -->
